<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriConnect - Registration</title>


    <style>

        /* =================================================
           GENERAL
        ================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.20),
                    rgba(255, 255, 255, 0.20)
                ),
                url("assets/agri-background.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 40px 20px;

        }


        /* =================================================
           BACK BUTTON
        ================================================= */

        .back-button {

            position: fixed;

            top: 22px;

            left: 30px;

            padding: 9px 18px;

            border: none;

            border-radius: 8px;

            background:
                rgba(90, 90, 90, 0.75);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition:
                background 0.2s;

            z-index: 10;

        }


        .back-button:hover {

            background:
                rgba(60, 60, 60, 0.90);

        }


        /* =================================================
           MAIN CONTAINER
        ================================================= */

        .container {

            width: 100%;

            max-width: 600px;

            background:
                rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(8px);

            padding: 35px 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.20);

        }


        /* =================================================
           LOGO
        ================================================= */

        .logo-container {

            text-align: center;

            margin-bottom: 15px;

        }


        .logo {

            width: 170px;

            max-width: 70%;

            height: auto;

            display: inline-block;

        }


        /* =================================================
           HEADING
        ================================================= */

        h1 {

            text-align: center;

            color: #2e7d32;

            font-size: 28px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            font-size: 15px;

            margin-bottom: 28px;

        }


        /* =================================================
           FORM LABELS
        ================================================= */

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            color: #222;

            font-size: 14px;

            font-weight: bold;

        }


        /* =================================================
           INPUTS AND SELECT
        ================================================= */

        input,
        select {

            width: 100%;

            padding: 12px 13px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            background: white;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }


        input:focus,
        select:focus {

            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px
                rgba(46, 125, 50, 0.12);

        }


        /* =================================================
           ROLE-SPECIFIC FIELDS
        ================================================= */

        .role-fields {

            display: none;

        }


        /* =================================================
           FILE INPUT
        ================================================= */

        input[type="file"] {

            padding: 9px;

            cursor: pointer;

        }


        /* =================================================
           CREATE ACCOUNT BUTTON
        ================================================= */

        .submit-button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;

        }


        .submit-button:hover {

            background: #256628;

        }


        .submit-button:active {

            transform:
                scale(0.99);

        }


        .submit-button:disabled {

            background: #8aaa8c;

            cursor: not-allowed;

        }


        /* =================================================
           MESSAGE
        ================================================= */

        #message {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            min-height: 20px;

        }


        /* =================================================
           LOGIN LINK
        ================================================= */

        .login-link {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #555;

        }


        .login-link a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        /* =================================================
           RESPONSIVE DESIGN
        ================================================= */

        @media (max-width: 650px) {

            body {

                padding:
                    70px 12px 20px;

            }


            .back-button {

                top: 15px;

                left: 15px;

            }


            .container {

                padding:
                    30px 25px;

            }


            .logo {

                width: 150px;

            }


            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         BACK BUTTON
    ================================================= -->

    <button
        type="button"
        class="back-button"
        onclick="goBack()"
    >
        ← Back
    </button>


    <!-- =================================================
         REGISTRATION CONTAINER
    ================================================= -->

    <div class="container">


        <!-- =================================================
             LOGO
        ================================================= -->

        <div class="logo-container">

            <img
                src="assets/agriconnect-logo.png"
                alt="AgriConnect Logo"
                class="logo"
            >

        </div>


        <!-- =================================================
             HEADING
        ================================================= -->

        <h1>
            Create your AgriConnect account
        </h1>


        <p class="subtitle">
            Register to get started
        </p>


        <!-- =================================================
             REGISTRATION FORM
        ================================================= -->

        <form
            id="registrationForm"
            enctype="multipart/form-data"
        >


            <!-- =================================================
                 FIRST NAME
            ================================================= -->

            <label for="first_name">
                First Name
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                required
            >


            <!-- =================================================
                 LAST NAME
            ================================================= -->

            <label for="last_name">
                Last Name
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                required
            >


            <!-- =================================================
                 PHONE NUMBER
            ================================================= -->

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                required
            >


            <!-- =================================================
                 EMAIL
            ================================================= -->

            <label for="email">
                Email (Optional)
            </label>

            <input
                type="email"
                id="email"
                name="email"
            >


            <!-- =================================================
                 DISTRICT
            ================================================= -->

            <label for="district">
                District
            </label>

            <select
                id="district"
                name="district"
                required
            >

                <option value="">
                    Select your district
                </option>

                <option value="Ampara">
                    Ampara
                </option>

                <option value="Anuradhapura">
                    Anuradhapura
                </option>

                <option value="Badulla">
                    Badulla
                </option>

                <option value="Batticaloa">
                    Batticaloa
                </option>

                <option value="Colombo">
                    Colombo
                </option>

                <option value="Galle">
                    Galle
                </option>

                <option value="Gampaha">
                    Gampaha
                </option>

                <option value="Hambantota">
                    Hambantota
                </option>

                <option value="Jaffna">
                    Jaffna
                </option>

                <option value="Kalutara">
                    Kalutara
                </option>

                <option value="Kandy">
                    Kandy
                </option>

                <option value="Kegalle">
                    Kegalle
                </option>

                <option value="Kilinochchi">
                    Kilinochchi
                </option>

                <option value="Kurunegala">
                    Kurunegala
                </option>

                <option value="Mannar">
                    Mannar
                </option>

                <option value="Matale">
                    Matale
                </option>

                <option value="Matara">
                    Matara
                </option>

                <option value="Monaragala">
                    Monaragala
                </option>

                <option value="Mullaitivu">
                    Mullaitivu
                </option>

                <option value="Nuwara Eliya">
                    Nuwara Eliya
                </option>

                <option value="Polonnaruwa">
                    Polonnaruwa
                </option>

                <option value="Puttalam">
                    Puttalam
                </option>

                <option value="Ratnapura">
                    Ratnapura
                </option>

                <option value="Trincomalee">
                    Trincomalee
                </option>

                <option value="Vavuniya">
                    Vavuniya
                </option>

            </select>


            <!-- =================================================
                 ROLE
            ================================================= -->

            <label for="role">
                Register As
            </label>

            <select
                id="role"
                name="role"
                required
            >

                <option value="">
                    Select your role
                </option>

                <option value="farmer">
                    Farmer
                </option>

                <option value="buyer">
                    Buyer
                </option>

                <option value="expert">
                    Agricultural Expert
                </option>

                <option value="equipment_provider">
                    Equipment Provider
                </option>

            </select>


            <!-- =================================================
                 NIC FRONT
            ================================================= -->

            <label for="nic_front">
                NIC Front
            </label>

            <input
                type="file"
                id="nic_front"
                name="nic_front"
                accept="image/*"
                required
            >


            <!-- =================================================
                 NIC BACK
            ================================================= -->

            <label for="nic_back">
                NIC Back
            </label>

            <input
                type="file"
                id="nic_back"
                name="nic_back"
                accept="image/*"
                required
            >


            <!-- =================================================
                 AGRICULTURAL EXPERT FIELDS
            ================================================= -->

            <div
                id="expertFields"
                class="role-fields"
            >

                <label for="specialization">
                    Specialization
                </label>

                <input
                    type="text"
                    id="specialization"
                    name="specialization"
                >


                <label for="certification_document">
                    Certification Document
                </label>

                <input
                    type="file"
                    id="certification_document"
                    name="certification_document"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

            </div>


            <!-- =================================================
                 EQUIPMENT PROVIDER FIELDS
            ================================================= -->

            <div
                id="providerFields"
                class="role-fields"
            >

                <label for="business_name">
                    Rental / Company Name
                </label>

                <input
                    type="text"
                    id="business_name"
                    name="business_name"
                >


                <label for="proof_document">
                    Proof Document
                </label>

                <input
                    type="file"
                    id="proof_document"
                    name="proof_document"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

            </div>


            <!-- =================================================
                 PASSWORD
            ================================================= -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <!-- =================================================
                 CONFIRM PASSWORD
            ================================================= -->

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >


            <!-- =================================================
                 SUBMIT BUTTON
            ================================================= -->

            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                Create Account
            </button>


        </form>


        <!-- =================================================
             MESSAGE
        ================================================= -->

        <div id="message"></div>


        <!-- =================================================
             LOGIN LINK
        ================================================= -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


    </div>


    <!-- =================================================
         JAVASCRIPT
    ================================================= -->

    <script>


        /* =================================================
           GET ELEMENTS
        ================================================= */

        const form =
            document.getElementById(
                "registrationForm"
            );


        const role =
            document.getElementById(
                "role"
            );


        const expertFields =
            document.getElementById(
                "expertFields"
            );


        const providerFields =
            document.getElementById(
                "providerFields"
            );


        const specialization =
            document.getElementById(
                "specialization"
            );


        const certificationDocument =
            document.getElementById(
                "certification_document"
            );


        const businessName =
            document.getElementById(
                "business_name"
            );


        const proofDocument =
            document.getElementById(
                "proof_document"
            );


        const message =
            document.getElementById(
                "message"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        /* =================================================
           SHOW FIELDS ACCORDING TO ROLE
        ================================================= */

        role.addEventListener(
            "change",
            () => {

                /*
                 * Hide all role-specific fields
                 */

                expertFields.style.display =
                    "none";

                providerFields.style.display =
                    "none";


                /*
                 * Remove required status
                 */

                specialization.required =
                    false;

                certificationDocument.required =
                    false;

                businessName.required =
                    false;

                proofDocument.required =
                    false;


                /*
                 * Agricultural Expert
                 */

                if (
                    role.value === "expert"
                ) {

                    expertFields.style.display =
                        "block";

                    specialization.required =
                        true;

                    certificationDocument.required =
                        true;

                }


                /*
                 * Equipment Provider
                 */

                if (
                    role.value ===
                    "equipment_provider"
                ) {

                    providerFields.style.display =
                        "block";

                    businessName.required =
                        true;

                    proofDocument.required =
                        true;

                }

            }
        );


        /* =================================================
           CREATE REGISTRATION ID
        ================================================= */

        function createRegistrationId() {

            return (
                "REG-" +
                Date.now() +
                "-" +
                Math.floor(
                    Math.random() * 1000
                )
            );

        }


        /* =================================================
           GET SAVED REGISTRATIONS
        ================================================= */

        function getRegistrations() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "agriConnectRegistrations"
                    ) || "[]"
                );

            }

            catch (error) {

                console.error(
                    "Unable to read registrations:",
                    error
                );

                return [];

            }

        }


        /* =================================================
           SAVE REGISTRATIONS
        ================================================= */

        function saveRegistrations(
            registrations
        ) {

            localStorage.setItem(
                "agriConnectRegistrations",
                JSON.stringify(
                    registrations
                )
            );

        }


        /* =================================================
           SAVE ADMIN REGISTRATION
           
           ONLY EXPERT AND PROVIDER APPLICATIONS
           ARE SENT TO ADMIN REGISTRATION LIST.
        ================================================= */

        function saveForAdminReview() {

            const selectedRole =
                role.value;


            /*
             * Farmer and Buyer do not require
             * Admin registration approval.
             */

            if (
                selectedRole !== "expert" &&
                selectedRole !==
                    "equipment_provider"
            ) {

                return;

            }


            const firstName =
                document
                    .getElementById(
                        "first_name"
                    )
                    .value
                    .trim();


            const lastName =
                document
                    .getElementById(
                        "last_name"
                    )
                    .value
                    .trim();


            const fullName =
                `${firstName} ${lastName}`;


            const email =
                document
                    .getElementById(
                        "email"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "phone"
                    )
                    .value
                    .trim();


            const district =
                document
                    .getElementById(
                        "district"
                    )
                    .value;


            const registrations =
                getRegistrations();


            /*
             * Check whether the same email
             * already has a pending application.
             */

            const existing =
                registrations.find(
                    registration =>
                        registration.email &&
                        email &&
                        registration.email
                            .toLowerCase() ===
                            email.toLowerCase() &&
                        registration.status ===
                            "Pending"
                );


            if (existing) {

                return;

            }


            /*
             * Create the application object.
             */

            const application = {

                id:
                    createRegistrationId(),

                firstName:
                    firstName,

                lastName:
                    lastName,

                name:
                    fullName,

                phone:
                    phone,

                email:
                    email,

                district:
                    district,

                role:
                    selectedRole === "expert"
                        ? "Agricultural Expert"
                        : "Equipment Provider",

                type:
                    selectedRole === "expert"
                        ? "expert"
                        : "provider",


                /*
                 * Expert information
                 */

                specialization:
                    selectedRole === "expert"
                        ? specialization.value.trim()
                        : "",


                certificationDocument:
                    selectedRole === "expert" &&
                    certificationDocument.files.length > 0
                        ? certificationDocument
                            .files[0]
                            .name
                        : "",


                /*
                 * Provider information
                 */

                businessName:
                    selectedRole ===
                        "equipment_provider"
                        ? businessName.value.trim()
                        : "",


                proofDocument:
                    selectedRole ===
                        "equipment_provider" &&
                    proofDocument.files.length > 0
                        ? proofDocument
                            .files[0]
                            .name
                        : "",


                /*
                 * NIC document names
                 */

                nicFront:
                    document
                        .getElementById(
                            "nic_front"
                        )
                        .files.length > 0
                        ? document
                            .getElementById(
                                "nic_front"
                            )
                            .files[0]
                            .name
                        : "",


                nicBack:
                    document
                        .getElementById(
                            "nic_back"
                        )
                        .files.length > 0
                        ? document
                            .getElementById(
                                "nic_back"
                            )
                            .files[0]
                            .name
                        : "",


                /*
                 * Registration information
                 */

                submittedAt:
                    new Date()
                        .toISOString(),


                submittedDate:
                    new Date()
                        .toLocaleDateString(
                            "en-GB",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric"
                            }
                        ),


                status:
                    "Pending"

            };


            /*
             * Add application to the
             * AgriConnect registration list.
             */

            registrations.push(
                application
            );


            saveRegistrations(
                registrations
            );

        }


        /* =================================================
           REGISTRATION FORM SUBMIT
        ================================================= */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                message.textContent =
                    "";


                /*
                 * Check password
                 */

                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirm_password"
                        )
                        .value;


                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;

                }


                /*
                 * Disable button
                 */

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "Creating Account...";


                /*
                 * Create FormData
                 */

                const formData =
                    new FormData(form);


                /*
                 * Confirm password is only
                 * used for frontend validation.
                 */

                formData.delete(
                    "confirm_password"
                );


                try {


                    /*
                     * Send registration to backend.
                     */

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    /*
                     * Try to read JSON response.
                     */

                    let result = {};

                    try {

                        result =
                            await response.json();

                    }

                    catch (jsonError) {

                        result = {};

                    }


                    /*
                     * Registration successful
                     */

                    if (response.ok) {


                        /*
                         * IMPORTANT:
                         *
                         * Save Expert and Equipment
                         * Provider registrations for
                         * Admin review.
                         */

                        saveForAdminReview();


                        /*
                         * Different message for
                         * Expert / Provider.
                         */

                        if (
                            role.value === "expert"
                        ) {

                            message.innerHTML =
                                "Registration submitted successfully.<br><br>" +
                                "Your Agricultural Expert application is now <strong>Pending Admin Approval</strong>.";

                        }

                        else if (
                            role.value ===
                            "equipment_provider"
                        ) {

                            message.innerHTML =
                                "Registration submitted successfully.<br><br>" +
                                "Your Equipment Provider application is now <strong>Pending Admin Approval</strong>.";

                        }

                        else {

                            message.textContent =
                                result.message ||
                                "Registration successful.";

                        }


                        message.style.color =
                            "green";


                        /*
                         * Reset form.
                         */

                        form.reset();


                        expertFields.style.display =
                            "none";


                        providerFields.style.display =
                            "none";


                        /*
                         * Restore required fields.
                         */

                        specialization.required =
                            false;

                        certificationDocument.required =
                            false;

                        businessName.required =
                            false;

                        proofDocument.required =
                            false;


                    }

                    else {


                        /*
                         * Registration failed.
                         */

                        message.textContent =
                            result.message ||
                            "Registration failed. Please try again.";

                        message.style.color =
                            "red";

                    }


                }

                catch (error) {


                    console.error(
                        "Registration error:",
                        error
                    );


                    /*
                     * If the backend is unavailable,
                     * do NOT create an Admin application.
                     *
                     * This prevents an application from
                     * appearing in Admin when the account
                     * was not actually registered.
                     */

                    message.textContent =
                        "Unable to connect to the server.";

                    message.style.color =
                        "red";

                }


                /*
                 * Enable button again.
                 */

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Create Account";

            }
        );


        /* =================================================
           BACK BUTTON
        ================================================= */

        function goBack() {

            window.location.href =
                "index.html";

        }

    </script>


</body>

</html>
