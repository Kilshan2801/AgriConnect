<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AgriConnect - Administrator Login</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.18),
                    rgba(255, 255, 255, 0.18)
                ),
                url("assets/agri-background.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {

            position: fixed;

            top: 22px;

            left: 28px;

            padding: 10px 18px;

            border: none;

            border-radius: 8px;

            background:
                rgba(70, 70, 70, 0.78);

            color: white;

            font-size: 14px;

            cursor: pointer;

            z-index: 100;

            transition:
                background 0.2s;

        }


        .back-button:hover {

            background:
                rgba(45, 45, 45, 0.92);

        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            width: 100%;

            max-width: 440px;

            background:
                rgba(255, 255, 255, 0.92);

            backdrop-filter:
                blur(9px);

            border-radius: 20px;

            padding:
                32px 40px 35px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.18);

            text-align: center;

        }


        /* =====================================================
           LOCK ICON
        ===================================================== */

        .lock-container {

            width: 115px;

            height: 115px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background:
                #eadcff;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .lock-icon {

            font-size: 58px;

            line-height: 1;

        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            color: #111827;

            font-size: 28px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #444;

            font-size: 15px;

            line-height: 22px;

            margin-bottom: 27px;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            text-align: left;

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d0d5d2;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

            font-family: inherit;

            background: rgba(255,255,255,0.95);

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }


        input:focus {

            border-color:
                #7025c5;

            box-shadow:
                0 0 0 3px
                rgba(112, 37, 197, 0.12);

        }


        /* =====================================================
           PASSWORD WRAPPER
        ===================================================== */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 60px;

        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color:
                #7025c5;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background:
                #7025c5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;

        }


        .login-button:hover {

            background:
                #5e1eaa;

        }


        .login-button:active {

            transform:
                scale(0.99);

        }


        .login-button:disabled {

            background:
                #a89bb5;

            cursor: not-allowed;

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {

            min-height: 20px;

            margin-top: 16px;

            font-size: 13px;

            font-weight: bold;

        }


        /* =====================================================
           SECURITY NOTE
        ===================================================== */

        .security-note {

            margin-top: 20px;

            padding: 10px 12px;

            background:
                rgba(112, 37, 197, 0.06);

            border:
                1px solid
                rgba(112, 37, 197, 0.12);

            border-radius: 8px;

            color: #666;

            font-size: 11px;

            line-height: 17px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 500px) {

            body {

                padding: 20px 15px;

            }


            .login-card {

                padding:
                    28px 25px 30px;

            }


            .lock-container {

                width: 100px;

                height: 100px;

            }


            .lock-icon {

                font-size: 50px;

            }


            h1 {

                font-size: 25px;

            }


            .back-button {

                top: 12px;

                left: 12px;

            }

        }

    
/* =====================================================
   ACCESSIBILITY: VISIBLE KEYBOARD FOCUS
   (WCAG 2.2 - operable interfaces must show a visible
   focus indicator; restores it where outline was removed)
   ===================================================== */

:focus-visible {
    outline: 2.5px solid #2563eb !important;
    outline-offset: 2px !important;
}

</style>

</head>


<body>


    <!-- =====================================================
         BACK BUTTON
    ===================================================== -->

    <button
        type="button"
        class="back-button"
        onclick="goBack()"
    >

        ← Back

    </button>



    <!-- =====================================================
         LOGIN CARD
    ===================================================== -->

    <div class="login-card">


        <!-- =================================================
             LOCK
        ================================================= -->

        <div class="lock-container">

            <div class="lock-icon">
                🔐
            </div>

        </div>



        <!-- =================================================
             TITLE
        ================================================= -->

        <h1>
            Administrator Login
        </h1>


        <p class="subtitle">

            Secure Access for System<br>
            Administrators Only

        </p>



        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form id="adminLoginForm">


            <!-- =================================================
                 EMAIL
            ================================================= -->

            <div class="form-group">

                <label for="adminEmail">

                    Administrator Email

                </label>


                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- =================================================
                 PASSWORD
            ================================================= -->

            <div class="form-group">

                <label for="adminPassword">

                    Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter administrator password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >

                        Show

                    </button>

                </div>

            </div>



            <!-- =================================================
                 LOGIN BUTTON
            ================================================= -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                Admin Login

            </button>


        </form>



        <!-- =================================================
             MESSAGE
        ================================================= -->

        <div id="message"></div>



        <!-- =================================================
             SECURITY NOTE
        ================================================= -->

        <div class="security-note">

            🔒 This area is restricted to authorized
            AgriConnect administrators.

        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>


        /* =====================================================
           DEFAULT ADMIN CREDENTIALS
        ===================================================== */

        const ADMIN_EMAIL =
            "admin@agriconnect.com";



        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById(
                "adminLoginForm"
            );


        const emailInput =
            document.getElementById(
                "adminEmail"
            );


        const passwordInput =
            document.getElementById(
                "adminPassword"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );



        /* =====================================================
           SHOW / HIDE PASSWORD
        ===================================================== */

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    showPassword.textContent =
                        "Hide";

                }

                else {

                    passwordInput.type =
                        "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );



        /* =====================================================
           ADMIN LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;



                /* =============================================
                   CLEAR MESSAGE
                ============================================= */

                message.textContent = "";



                /* =============================================
                   CHECK ADMIN CREDENTIALS
                ============================================= */

            let isValid = false;

            try {
                const response = await fetch("/api/auth/admin-login", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                isValid = response.ok && result.success;

                if (response.status === 429) {
                      message.textContent = result.message;
                      return;
                }
            } catch (error) {
                message.textContent = "Cannot reach the server. Please try again.";
                return;
            }

            if (isValid) {


                    /* =========================================
                       CREATE ADMIN USER
                    ========================================= */

                    const adminUser = {

                        id:
                            26,

                        name:
                            "AgriConnect Administrator",

                        email:
                            ADMIN_EMAIL,

                        role:
                            "admin",

                        status:
                            "approved"

                    };


                    /* =========================================
                       SAVE ADMIN SESSION
                    ========================================= */

                    sessionStorage.setItem(
                        "user",
                        JSON.stringify(
                            adminUser
                        )
                    );


                    sessionStorage.setItem(
                        "selectedRole",
                        "admin"
                    );


                    sessionStorage.setItem(
                        "token",
                        "admin-demo-token"
                    );



                    /* =========================================
                       SUCCESS MESSAGE
                    ========================================= */

                    message.textContent =
                        "Login successful. Opening Admin Dashboard...";

                    message.style.color =
                        "#2e7d32";


                    loginButton.disabled =
                        true;

                    loginButton.textContent =
                        "Opening Dashboard...";



                    /* =========================================
                       REDIRECT
                    ========================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "admin-dashboard.html";

                        },
                        600
                    );


                }

                else {


                    /* =========================================
                       INVALID LOGIN
                    ========================================= */

                    message.textContent =
                        "Invalid administrator email or password.";

                    message.style.color =
                        "#d32f2f";


                    passwordInput.value = "";


                }

            }
        );



        /* =====================================================
           BACK BUTTON
        ===================================================== */

        function goBack() {

            window.location.href =
                "index.html";

        }


    </script>


</body>

</html>
